<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Medication Schedule</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="images/MediTrack Logo.png" alt="MediTrack Logo">
        </div>
        <nav class="navbar">
            <a href="index.html">Home</a>
        </nav>
    </header>

    <main class="main-container">
        <section class="add-medication-section">
            <div class="form-container">
                <div class="image-upload-section">
                    <div class="image-preview" id="imagePreview">
                        <img id="previewImage" src="#" alt="Medicine Image Preview">
                        <span class="default-text">Medicine Image Preview</span>
                    </div>
                    <label for="medicineImage" class="upload-btn">Upload Medicine Image</label>
                    <input type="file" id="medicineImage" accept="image/*">
                </div>

                <div class="form-section">
                    <h2>Add Medication Schedule</h2>
                    <form id="medicationForm">
                        <div class="input-field">
                            <label for="medicine-name">Medicine Name:</label>
                            <input type="text" id="medicine-name" name="medicine-name" required>
                        </div>
                        <div class="input-field">
                            <label for="dosage">Dosage:</label>
                            <input type="text" id="dosage" name="dosage" required>
                        </div>
                        <div class="input-field">
                            <label for="time">Time to Take Medicine:</label>
                            <input type="time" id="time" name="time" required>
                        </div>
                        <div class="input-field">
                            <label for="frequency">Frequency:</label>
                            <select id="frequency" name="frequency">
                                <option value="once">Once daily</option>
                                <option value="twice">Twice daily</option>
                                <option value="thrice">Three times daily</option>
                                <option value="custom">Custom</option>
                            </select>
                        </div>
                        <button type="submit" class="btn">Add Schedule</button>
                    </form>
                </div>
            </div>
        </section>

        <section class="schedule-list-section" id="scheduleList">
            <h2>Your Medication Schedules</h2>
            <div class="schedules-container" id="schedulesContainer">
            </div>
        </section>
    </main>

    <script src="scriptt.js"></script>
</body>
</html>
